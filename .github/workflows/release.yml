name: Release

on:
  push:
    tags:
      - 'v*'

# Nothing by default; each job asks for what it needs.
permissions: {}

jobs:
  # The exe name and the in-app version come from package.json; a tag without a matching bump
  # would publish v0.1.1 containing PresetDoctor-0.1.0-portable.exe. Runs first and needs no
  # npm ci, so a mistagged release fails in seconds instead of after the full CI suite.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check that the tag matches every package version
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          for p in . packages/core packages/ui apps/desktop apps/web; do
            pv=$(node -p "require('./$p/package.json').version")
            if [ "$pv" != "$v" ]; then
              echo "::error::$p/package.json is $pv but the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done

  # Everything CI checks (lint, format, typecheck, build, tests, both e2e suites), so a tag on a
  # commit that fails CI never becomes a release.
  checks:
    needs: version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Packages the exe and smoke-tests it, with a read-only token that isn't left in .git/config,
  # so code run by npm ci or the build can't push to the repo or touch releases. The build and
  # the tests already ran in checks; desktop:dist does its own electron-vite build.
  build:
    needs: [version, checks]
    runs-on: windows-latest
    # Launches Electron; don't let a window that never exits run to the 6-hour default.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The exe is unsigned on purpose (see README); don't let electron-builder look for a cert.
      - run: npm run desktop:dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Launches what ships (the portable target builds win-unpacked first), not just out/: catches
      # files missing from the package, a broken preload or a CSP that blocks the bundle.
      - name: Smoke-test the packaged exe
        run: node apps/desktop/e2e/smoke.mts
        env:
          # Absolute: playwright resolves executablePath against the working directory.
          PRESET_DOCTOR_E2E_EXE: '${{ github.workspace }}\apps\desktop\release\win-unpacked\Preset Doctor.exe'
      - uses: actions/upload-artifact@v7
        with:
          name: portable-exe
          path: apps/desktop/release/*.exe
          if-no-files-found: error

  build-mac:
    needs: [version, checks]
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run desktop:dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v7
        with:
          name: mac-release
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
          if-no-files-found: error

  # Publishes with the preinstalled gh CLI and GitHub's own actions: no checkout, no npm.
  publish:
    needs: [build, build-mac]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: portable-exe
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: mac-release
          path: dist
      # Lets anyone check the unsigned exe was built here: gh attestation verify <exe> -R <repo>.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
      - name: Write checksums
        working-directory: dist
        run: sha256sum *.* > SHA256SUMS.txt
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
