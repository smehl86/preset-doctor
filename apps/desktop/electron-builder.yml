# Desktop builds: Windows portable exe and macOS DMG / ZIP.
appId: io.github.presetdoctor.desktop
productName: Preset Doctor
copyright: Preset Doctor contributors. Not affiliated with Bambu Lab.
directories:
  output: release
  buildResources: build
# electron-vite bundles everything (core, React, fflate) into out/, so no node_modules ship.
files:
  - out/**
  - resources/**
  - package.json
  - '!**/*.map'
asar: true
npmRebuild: false
electronLanguages:
  - en-US
win:
  target:
    - target: portable
      arch: x64
  icon: build/icon.ico
portable:
  artifactName: PresetDoctor-${version}-portable.exe
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  icon: build/icon.png
  category: public.app-category.utilities
  identity: null
dmg:
  artifactName: PresetDoctor-${version}-${arch}.dmg
publish: null
